name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Project and Prepare Gradle
        run: |
          # ১. ZIP ফাইল সম্পূর্ণ এক্সট্র্যাক্ট করা
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_tmp
            BUILD_FILE=$(find extracted_tmp -name "build.gradle*" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJ_DIR=$(dirname "$BUILD_FILE")
              cp -a "$PROJ_DIR"/. .
            fi
            rm -rf extracted_tmp
          fi

          # ২. মিসিং রিসোর্স ফাইল তৈরি করা
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          fi
          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; me
            echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          fi

          # ৩. Gradle Wrapper তৈরি করা
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
