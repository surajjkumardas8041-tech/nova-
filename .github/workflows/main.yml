name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Fix Project Structure
        run: |
          # ১. ZIP ফাইল সঠিকভাবে এক্সট্র্যাক্ট করা
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_tmp
            
            # settings.gradle খুঁজে আসল রুট ফোল্ডার সনাক্ত করা
            SETTINGS_FILE=$(find extracted_tmp -iname "settings.gradle*" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJ_DIR=$(dirname "$SETTINGS_FILE")
              echo "Found project root at: $PROJ_DIR"
              cp -a "$PROJ_DIR"/. .
            fi
            rm -rf extracted_tmp
          fi

          # ২. মিসিং XML ফাইল তৈরি নিশ্চিত করা
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          fi
          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          fi

          # ৩. gradlew পারমিশন দেওয়া
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
