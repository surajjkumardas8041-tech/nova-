name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project & Fix Catalog
        run: |
          # ১. জিপ ফাইল আনজিপ করা ও ফাইলগুলো রুটে আনা
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_tmp
            BUILD_FILE=$(find extracted_tmp -name "build.gradle*" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              PROJ_DIR=$(dirname "$BUILD_FILE")
              cp -a "$PROJ_DIR"/. .
            fi
            rm -rf extracted_tmp
          fi

          # ২. Version Catalog (libs.versions.toml) ফাইল সরাসরি ./gradle/ এ কপি করা
          mkdir -p gradle
          find . -name "libs.versions.toml" -exec cp -f {} gradle/libs.versions.toml \;

          # ৩. gradlew পারমিশন বা নতুন wrapper তৈরি করা
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
