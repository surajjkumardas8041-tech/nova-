name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d extracted_tmp
            SETTINGS_FILE=$(find extracted_tmp -iname "settings.gradle*" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJ_DIR=$(dirname "$SETTINGS_FILE")
              cp -a "$PROJ_DIR"/. .
            fi
            rm -rf extracted_tmp
          fi

      - name: Auto-Fix MainActivity Kotlin Syntax Error
        run: |
          FILE=$(find app/src/main/java -iname "MainActivity.kt" | head -n 1)
          if [ -n "$FILE" ]; then
            echo "Fixing syntax error in $FILE..."
            sed -i 's/Text(text = ""$cmd"")/Text(text = cmd)/g' "$FILE"
            sed -i 's/Text(text = "\\" $cmd \\"")/Text(text = cmd)/g' "$FILE"
          fi

      - name: Fix Resources and Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> ~/.gradle/gradle.properties

          mkdir -p app/src/main/res/mipmap app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml

          find app/src/main/res/xml/ -type f -name "*.xml" -exec sed -i 's/android:supportsLaunchFromKeyguard="[^"]*"//g' {} + 2>/dev/null || true

          DUMMY_VECTOR='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M0,0h24v24H0z"/></vector>'

          [ ! -f "app/src/main/res/mipmap/ic_launcher.xml" ] && echo "$DUMMY_VECTOR" > app/src/main/res/mipmap/ic_launcher.xml
          [ ! -f "app/src/main/res/mipmap/ic_launcher_round.xml" ] && echo "$DUMMY_VECTOR" > app/src/main/res/mipmap/ic_launcher_round.xml
          [ ! -f "app/src/main/res/drawable/ic_nova_tile.xml" ] && echo "$DUMMY_VECTOR" > app/src/main/res/drawable/ic_nova_tile.xml

          cat << 'EOF' > app/src/main/res/values/generated_themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NovaAssistant" parent="android:Theme.Material.Light.NoActionBar" />
              <style name="Theme.NovaAssistant.Translucent" parent="Theme.NovaAssistant" />
          </resources>
          EOF

          echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><recognition-service xmlns:android="http://schemas.android.com/apk/res/android" />' > app/src/main/res/xml/recognition_service.xml
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" />' > app/src/main/res/xml/accessibility_service_config.xml

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
