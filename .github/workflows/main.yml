name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_tmp
            SETTINGS_FILE=$(find extracted_tmp -iname "settings.gradle*" | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJ_DIR=$(dirname "$SETTINGS_FILE")
              cp -a "$PROJ_DIR"/. .
            fi
            rm -rf extracted_tmp
          fi

      - name: Generate Missing Fallback Resources
        run: |
          mkdir -p app/src/main/res/mipmap
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          DUMMY_VECTOR='<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FF000000" android:pathData="M0,0h24v24H0z"/></vector>'

          # ১. আইকন ও ড্রয়েবল জেনারেট করা
          if [ -z "$(find app/src/main/res -name 'ic_launcher.*')" ]; then
            echo "$DUMMY_VECTOR" > app/src/main/res/mipmap/ic_launcher.xml
          fi
          if [ -z "$(find app/src/main/res -name 'ic_launcher_round.*')" ]; then
            echo "$DUMMY_VECTOR" > app/src/main/res/mipmap/ic_launcher_round.xml
          fi
          if [ -z "$(find app/src/main/res -name 'ic_nova_tile.*')" ]; then
            echo "$DUMMY_VECTOR" > app/src/main/res/drawable/ic_nova_tile.xml
          fi

          # ২. মিসিং থিম তৈরি করা
          cat << 'EOF' > app/src/main/res/values/generated_themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NovaAssistant" parent="android:Theme.Material.Light.NoActionBar" />
              <style name="Theme.NovaAssistant.Translucent" parent="Theme.NovaAssistant" />
          </resources>
          EOF

          # ৩. মিসিং XML সার্ভিস কনফিগ ফাইল তৈরি করা
          echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><recognition-service xmlns:android="http://schemas.android.com/apk/res/android" />' > app/src/main/res/xml/recognition_service.xml
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" />' > app/src/main/res/xml/accessibility_service_config.xml

          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
