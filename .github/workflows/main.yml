GitHub Actions-এর Build Debug APK বর্তমানে FAILED হচ্ছে। Screenshot-এর compiler errors অনুযায়ী "AssistantViewModel.kt" এবং "AssistantIntentAction.kt"-এর মধ্যে access/type mismatch আছে।

দয়া করে পুরো project code পরীক্ষা করে root cause ঠিক করো।

বিশেষভাবে:

1. "AssistantIntentAction" class/data class কোথায় এবং কীভাবে declared হয়েছে তা পরীক্ষা করো।
2. কেন "AssistantViewModel.kt" থেকে "AssistantIntentAction" protected এবং constructor inaccessible হচ্ছে তা ঠিক করো।
3. "AssistantIntentAction"-এর "type" এবং "payload" property-এর সঠিক declaration নিশ্চিত করো।
4. "AssistantViewModel.kt"-এর unresolved "network" reference-টি ঠিক করো।
5. শুধু error line-এ workaround দেবে না; ViewModel ও IntentAction-এর architecture-এর সঙ্গে সামঞ্জস্য রেখে proper fix করো।
6. Nova-এর existing voice assistant functionality নষ্ট করবে না।
7. প্রয়োজন হলে সংশ্লিষ্ট Kotlin files একসঙ্গে update করো।
8. তারপর "./gradlew assembleDebug" চালিয়ে সম্পূর্ণ build verify করো।
9. Build সফল না হওয়া পর্যন্ত APK তৈরি হয়েছে বলে দাবি করবে না।
10. Build সফল হলে তৈরি হওয়া APK-এর exact path এবং download/export করার উপায় জানাবে।

বর্তমান build log-এ পাওয়া প্রধান error:

- "Unresolved reference: network"
- "Cannot access 'AssistantIntentAction': it is protected"
- "Cannot access constructor"
- "Unresolved reference: type"
- "Unresolved reference: payload"

প্রথমে source code ঠিক করো, তারপর আবার Debug APK build করো।
