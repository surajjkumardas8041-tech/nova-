name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Find and Prepare Project
        run: |
          # 1. ZIP ফাইল থাকলে তা আনজিপ করা
          ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d extracted_tmp
            GRADLE_LOCATION=$(find extracted_tmp -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_LOCATION" ]; then
              PROJ_DIR=$(dirname "$GRADLE_LOCATION")
              cp -rn "$PROJ_DIR"/* .
            fi
            rm -rf extracted_tmp
          fi

          # 2. gradlew ফাইল রুট ফোল্ডারে সেট করা
          if [ ! -f "gradlew" ]; then
            GRADLE_LOCATION=$(find . -name "gradlew" | head -n 1)
            if [ -n "$GRADLE_LOCATION" ]; then
              PROJ_DIR=$(dirname "$GRADLE_LOCATION")
              cp -rn "$PROJ_DIR"/* .
            fi
          fi

          # 3. মিসিং XML রিসোর্স তৈরি করা
          mkdir -p app/src/main/res/xml
          
          # যেকোনো জায়গায় থাকা XML ফাইল সঠিক ফোল্ডারে কপি করা
          find . -name "*.xml" ! -path "./app/src/main/res/*" -exec cp {} app/src/main/res/xml/ \; 2>/dev/null || true

          # মিসিং রুলস ফাইল ডামি হিসেবে ক্রিয়েট করা
          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          fi

          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>' > app/src/main/res/xml/backup_rules.xml
          fi

          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
